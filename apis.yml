aid: enterpret
name: Enterpret
description: >-
  Enterpret is a customer intelligence platform that unifies feedback from 50+
  sources — support tickets, sales and success calls, surveys, reviews, app
  stores, and social — into a single source of truth built on a proprietary
  Customer Knowledge Graph and Adaptive Taxonomy. Product, CX, and go-to-market
  teams use it to quantify what is driving churn, prioritize the roadmap, and
  surface win/loss reasons. Its Wisdom AI and hosted MCP server let teams query
  customer feedback in natural language from Claude, Cursor, Notion, Slack,
  ChatGPT, and other agents, with citations back to source records.
